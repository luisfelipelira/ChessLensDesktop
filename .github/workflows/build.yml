name: Build Windows release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source
        run: npm run check

      - name: Build portable executable
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: ChessLens-Windows
          path: dist/*.exe

      - name: Upload browser connector
        uses: actions/upload-artifact@v4
        with:
          name: ChessLens-Connector
          path: chrome-connector/**
